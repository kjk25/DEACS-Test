[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets@^2.6.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -fmacro-prefix-map=${sysenv.USERPROFILE}=.
  -ffile-prefix-map=${sysenv.USERPROFILE}=.
