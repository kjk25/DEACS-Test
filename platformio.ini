[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/build_usb_page.py
upload_port = COM9
monitor_port = COM9
monitor_speed = 921600
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets@^2.6.1
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; Native USB connector (CDC/JTAG) instead of the USB-UART connector.
[env:esp32s3_n16r8_usb]
extends = env:esp32s3_n16r8
build_flags =
  ${env:esp32s3_n16r8.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
